name: Windows witness kit

on:
  pull_request:
  workflow_run:
    workflows:
      - Windows build & release
    types:
      - completed

jobs:
  recorder-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone witness recorder
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --paths . --hidden-import tools.verify_release_package --name BackgroundPXR-Witness tools/windows_witness.py
          if (-not (Test-Path dist/BackgroundPXR-Witness.exe)) {
            throw 'Standalone BackgroundPXR-Witness.exe was not produced.'
          }
      - name: Smoke standalone witness recorder
        shell: pwsh
        run: |
          & .\dist\BackgroundPXR-Witness.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  workflow-run-probe:
    if: github.event_name == 'workflow_run'
    runs-on: windows-latest
    steps:
      - name: Probe workflow-run trigger
        shell: pwsh
        run: Write-Host "Witness trigger source run ${{ github.event.workflow_run.id }}"
