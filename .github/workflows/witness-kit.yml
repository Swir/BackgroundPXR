name: Windows witness kit

on:
  pull_request:
  workflow_run:
    workflows:
      - Windows build & release
    types:
      - completed

jobs:
  recorder-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone witness recorder
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --paths . --hidden-import tools.verify_release_package --name BackgroundPXR-Witness tools/windows_witness.py
          if (-not (Test-Path dist/BackgroundPXR-Witness.exe)) {
            throw 'Standalone BackgroundPXR-Witness.exe was not produced.'
          }
      - name: Smoke standalone witness recorder
        shell: pwsh
        run: |
          & .\dist\BackgroundPXR-Witness.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-witness-kit:
    if: github.event_name == 'workflow_run'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve exact qualification artifact
        id: qualification
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const eligible = run.conclusion === 'success' && run.head_branch === 'main' && run.event === 'push';
            const expected = `BackgroundPXR-qualification-${run.head_sha}`;
            if (!eligible) {
              core.setOutput('found', 'false');
              core.setOutput('name', expected);
              return;
            }
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const artifact = response.data.artifacts.find(
              item => item.name === expected && !item.expired
            );
            core.setOutput('found', artifact ? 'true' : 'false');
            core.setOutput('name', expected);
      - name: Checkout exact qualified source
        if: steps.qualification.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download exact qualification artifact
        if: steps.qualification.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.qualification.outputs.name }}
          path: qualification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Set up Python for witness recorder
        if: steps.qualification.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone witness recorder
        if: steps.qualification.outputs.found == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --paths . --hidden-import tools.verify_release_package --name BackgroundPXR-Witness tools/windows_witness.py
          if (-not (Test-Path dist/BackgroundPXR-Witness.exe)) {
            throw 'Standalone BackgroundPXR-Witness.exe was not produced.'
          }
      - name: Verify standalone recorder against exact RC
        if: steps.qualification.outputs.found == 'true'
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $archives = @(Get-ChildItem qualification -File -Filter 'BackgroundPXR-*-Windows.zip')
          $checksums = @(Get-ChildItem qualification -File -Filter 'BackgroundPXR-*-Windows.zip.sha256')
          if ($archives.Count -ne 1 -or $checksums.Count -ne 1) {
            throw "Expected one RC ZIP and checksum; found $($archives.Count) ZIP(s) and $($checksums.Count) checksum(s)."
          }
          Remove-Item witness-smoke.json -ErrorAction SilentlyContinue
          & .\dist\BackgroundPXR-Witness.exe init `
            --archive $archives[0].FullName `
            --checksum $checksums[0].FullName `
            --output witness-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path witness-smoke.json)) {
            throw 'Standalone witness recorder did not initialize exact-package evidence.'
          }
          $candidate = (Get-Content witness-smoke.json -Raw | ConvertFrom-Json).candidate
          if ($candidate.source_sha -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Witness recorder bound evidence to $($candidate.source_sha), expected $env:EXPECTED_SOURCE_SHA."
          }
